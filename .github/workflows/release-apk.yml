name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v1.3.6
        required: true

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    # Subject must start with "Release apk". Do not use contains() — a later
    # "Docs:" checksum commit mentioning the job would rebuild and drift hashes.
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'Release apk')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm 1.3.6 source on main
        run: |
          set -euo pipefail
          grep -q 'versionName = "1.3.6"' android/app/build.gradle.kts
          grep -q '__version__ = "1.3.6"' meridian/__init__.py
          test -f android/keystore/sideload.jks.b64
          test -f meridian/features.py
          ! grep -q 'FULL_CONTENT_FROM_WORKSPACE' meridian/features.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          src = Path("meridian/features.py").read_text()
          ast.parse(src)
          assert "set_external_pcm_decoder" in src
          print("features.py ok", len(src), "bytes")
          PY

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Platform, NDK, CMake
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Sideload keystore
        run: |
          if [ ! -f android/keystore/sideload.jks ]; then
            base64 -d android/keystore/sideload.jks.b64 > android/keystore/sideload.jks
          fi

      - name: Launcher PNGs
        run: python3 android/scripts/write-launcher-pngs.py

      - name: Ubuntu fonts
        run: bash android/scripts/fetch-ubuntu-fonts.sh

      - name: Media3 FFmpeg JNI (arm64)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
          MERIDIAN_FFMPEG_ABIS: arm64-v8a
          # Rebuild when Listen PCM (avformat) is missing or FORCE is set.
          MERIDIAN_FFMPEG_FORCE: "1"
        run: bash android/scripts/build-media3-ffmpeg.sh

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble arm64 release
        working-directory: android
        run: gradle :app:assembleRelease -Pabi=arm64-v8a --no-daemon

      - name: Package APK, stamp docs, source, tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          src="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$src"
          cp "$src" dist/Meridian-1.3.6-arm64.apk
          unzip -l dist/Meridian-1.3.6-arm64.apk | grep -F 'lib/arm64-v8a/libffmpegJNI.so'
          unzip -l dist/Meridian-1.3.6-arm64.apk | grep -F 'lib/arm64-v8a/libmeridian_aubio.so'
          unzip -l dist/Meridian-1.3.6-arm64.apk | grep -F 'lib/arm64-v8a/libmeridian_pcm.so'
          (cd dist && sha256sum Meridian-1.3.6-arm64.apk | tee Meridian-1.3.6-arm64.apk.sha256)
          APK_SHA="$(awk '{print $1}' dist/Meridian-1.3.6-arm64.apk.sha256)"
          STAMP_DATE="$(TZ=America/New_York date +%F)"
          python3 android/scripts/stamp-release-docs.py \
            --date "$STAMP_DATE" \
            --apk-sha "$APK_SHA"
          git add \
            README.md CHANGELOG.md .github/release-notes-1.3.6.md \
            docs/android.md docs/README.md SOURCE_OFFER.txt \
            THIRD_PARTY_NOTICES.txt android/keystore/README.md \
            patches/README.md \
            resources/metainfo/io.github.dark1ltg.Meridian.metainfo.xml
          TREE="$(git write-tree)"
          git archive --format=tar.gz --prefix=Meridian-Android-1.3.6/ \
            -o dist/Meridian-1.3.6-src.tar.gz "$TREE"
          (cd dist && sha256sum Meridian-1.3.6-src.tar.gz | tee Meridian-1.3.6-src.tar.gz.sha256)
          SRC_SHA="$(awk '{print $1}' dist/Meridian-1.3.6-src.tar.gz.sha256)"
          python3 android/scripts/stamp-release-docs.py \
            --date "$STAMP_DATE" \
            --apk-sha "$APK_SHA" \
            --src-sha "$SRC_SHA"
          python3 android/scripts/stamp-release-docs.py --date "$STAMP_DATE" --check
          git add \
            README.md CHANGELOG.md .github/release-notes-1.3.6.md \
            docs/android.md docs/README.md SOURCE_OFFER.txt \
            THIRD_PARTY_NOTICES.txt android/keystore/README.md \
            patches/README.md \
            resources/metainfo/io.github.dark1ltg.Meridian.metainfo.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "docs already matched this build"
          else
            VC="$(python3 -c 'import re,pathlib; print(re.search(r"versionCode\s*=\s*(\d+)", pathlib.Path("android/app/build.gradle.kts").read_text()).group(1))')"
            git commit -m "Docs: checksums for versionCode ${VC}"
            git push origin HEAD:main
          fi
          tag="${{ github.event.inputs.tag || 'v1.3.6' }}"
          git tag -f "$tag" HEAD
          git push origin "refs/tags/${tag}" --force
          ls -la dist
          echo "apk $APK_SHA"
          echo "src $SRC_SHA"

      # Overwriting assets on an existing release leaves published_at stuck on the
      # first publish day. Drop the release (keep the tag) so softprops creates a
      # fresh one and the Releases page shows today's date.
      - name: Drop prior GitHub Release (refresh publish date)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || 'v1.3.6' }}"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || 'v1.3.6' }}
          name: Meridian Android 1.3.6
          body_path: .github/release-notes-1.3.6.md
          files: |
            dist/Meridian-1.3.6-arm64.apk
            dist/Meridian-1.3.6-arm64.apk.sha256
            dist/Meridian-1.3.6-src.tar.gz
            dist/Meridian-1.3.6-src.tar.gz.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
