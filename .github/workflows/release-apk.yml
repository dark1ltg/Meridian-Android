name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v1.3.6
        required: true

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'release apk')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply 1.3.6 source patches
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess, sys
          root = pathlib.Path("patches")
          expected = {
              "01-features": "3cf1a6dab384784c4ee1d494530f6f9c35c27991a1b4223bff566109ce4cbcd2",
              "02-engine": "08b28d7a9d755ddf7bc85557665913e2331e58c5b9de60430c1a27c04e1e80df",
              "03-tests": "d3a9d950909cdd3c09952f34e34b38f8fe081ccbc1c48e7a03a2bb7200f243cb",
              "04-android": "2e108adab2783fad592383a591faea057573a703cb129f6a9e662c9c408c9288",
              "05-docs": "48d233e823aaee94dbf73c9768c1556dcbfeb8e27fde1f12d2bd54e475bd2858",
          }
          optional = {"03-tests"}
          for stem, digest in expected.items():
              raw = root / f"{stem}.patch"
              packed = root / f"{stem}.patch.gz.b64"
              parts = sorted(root.glob(f"{stem}.part-*.b64"))
              dest = pathlib.Path(f"/tmp/{stem}.patch")
              try:
                  if parts:
                      blob = "".join(p.read_text().strip() for p in parts)
                      dest.write_bytes(gzip.decompress(base64.b64decode(blob)))
                  elif packed.is_file():
                      dest.write_bytes(gzip.decompress(base64.b64decode(packed.read_text().strip())))
                  elif raw.is_file():
                      dest.write_bytes(raw.read_bytes())
                  else:
                      raise FileNotFoundError(f"missing {stem}")
                  got = hashlib.sha256(dest.read_bytes()).hexdigest()
                  if got != digest:
                      raise ValueError(f"sha256 {got} != {digest}")
                  print(f"apply {stem} ({dest.stat().st_size} bytes)")
                  subprocess.check_call(["git", "apply", "--whitespace=nowarn", str(dest)])
              except Exception as exc:
                  if stem in optional:
                      print(f"skip optional {stem}: {exc}")
                      continue
                  print(f"failed {stem}: {exc}", file=sys.stderr)
                  sys.exit(1)
          PY

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Platform, NDK, CMake
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Sideload keystore
        run: |
          if [ ! -f android/keystore/sideload.jks ]; then
            base64 -d android/keystore/sideload.jks.b64 > android/keystore/sideload.jks
          fi

      - name: Launcher PNGs
        run: python3 android/scripts/write-launcher-pngs.py

      - name: Ubuntu fonts
        run: bash android/scripts/fetch-ubuntu-fonts.sh

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble arm64 release
        working-directory: android
        run: gradle :app:assembleRelease -Pabi=arm64-v8a --no-daemon

      - name: Package
        run: |
          mkdir -p dist
          src="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$src"
          cp "$src" dist/Meridian-1.3.6-arm64.apk
          sha256sum dist/Meridian-1.3.6-arm64.apk | tee dist/Meridian-1.3.6-arm64.apk.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || 'v1.3.6' }}
          name: Meridian Android 1.3.6
          body_path: .github/release-notes-1.3.6.md
          files: |
            dist/Meridian-1.3.6-arm64.apk
            dist/Meridian-1.3.6-arm64.apk.sha256
          fail_on_unmatched_files: true
          make_latest: true
