name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v1.3.6
        required: true

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'release apk')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply 1.3.6 source patches
        run: |
          set -euo pipefail
          for p in patches/01-features.patch patches/02-engine.patch \
                   patches/03-tests.patch patches/04-android.patch \
                   patches/05-docs.patch; do
            if [ -f "$p" ]; then
              echo "apply $p"
              git apply --whitespace=nowarn "$p"
            fi
          done

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Platform, NDK, CMake
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Sideload keystore
        run: |
          if [ ! -f android/keystore/sideload.jks ]; then
            base64 -d android/keystore/sideload.jks.b64 > android/keystore/sideload.jks
          fi

      - name: Launcher PNGs
        run: python3 android/scripts/write-launcher-pngs.py

      - name: Ubuntu fonts
        run: bash android/scripts/fetch-ubuntu-fonts.sh

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble arm64 release
        working-directory: android
        run: gradle :app:assembleRelease -Pabi=arm64-v8a --no-daemon

      - name: Package
        run: |
          mkdir -p dist
          src="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$src"
          cp "$src" dist/Meridian-1.3.6-arm64.apk
          sha256sum dist/Meridian-1.3.6-arm64.apk | tee dist/Meridian-1.3.6-arm64.apk.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || 'v1.3.6' }}
          name: Meridian Android 1.3.6
          body_path: .github/release-notes-1.3.6.md
          files: |
            dist/Meridian-1.3.6-arm64.apk
            dist/Meridian-1.3.6-arm64.apk.sha256
          fail_on_unmatched_files: true
          make_latest: true
