name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v1.3.6
        required: true

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'release apk')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm 1.3.6 source on main
        run: |
          set -euo pipefail
          grep -q 'versionName = "1.3.6"' android/app/build.gradle.kts
          grep -q '__version__ = "1.3.6"' meridian/__init__.py
          test -f android/keystore/sideload.jks.b64
          test -f meridian/features.py
          ! grep -q 'FULL_CONTENT_FROM_WORKSPACE' meridian/features.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          src = Path("meridian/features.py").read_text()
          ast.parse(src)
          assert "set_external_pcm_decoder" in src
          print("features.py ok", len(src), "bytes")
          PY

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Platform, NDK, CMake
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Sideload keystore
        run: |
          if [ ! -f android/keystore/sideload.jks ]; then
            base64 -d android/keystore/sideload.jks.b64 > android/keystore/sideload.jks
          fi

      - name: Launcher PNGs
        run: python3 android/scripts/write-launcher-pngs.py

      - name: Ubuntu fonts
        run: bash android/scripts/fetch-ubuntu-fonts.sh

      - name: Media3 FFmpeg JNI (arm64)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
          MERIDIAN_FFMPEG_ABIS: arm64-v8a
          # Rebuild when Listen PCM (avformat) is missing or FORCE is set.
          MERIDIAN_FFMPEG_FORCE: "1"
        run: bash android/scripts/build-media3-ffmpeg.sh

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble arm64 release
        working-directory: android
        run: gradle :app:assembleRelease -Pabi=arm64-v8a --no-daemon

      - name: Package APK + source
        run: |
          set -euo pipefail
          mkdir -p dist
          src="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$src"
          cp "$src" dist/Meridian-1.3.6-arm64.apk
          unzip -l dist/Meridian-1.3.6-arm64.apk | grep -F 'lib/arm64-v8a/libffmpegJNI.so'
          unzip -l dist/Meridian-1.3.6-arm64.apk | grep -F 'lib/arm64-v8a/libmeridian_aubio.so'
          # Basename paths so `sha256sum -c` works next to downloaded files.
          (cd dist && sha256sum Meridian-1.3.6-arm64.apk | tee Meridian-1.3.6-arm64.apk.sha256)
          # Source archive of this commit (GPL source offer companion).
          git archive --format=tar.gz --prefix=Meridian-Android-1.3.6/ -o dist/Meridian-1.3.6-src.tar.gz HEAD
          (cd dist && sha256sum Meridian-1.3.6-src.tar.gz | tee Meridian-1.3.6-src.tar.gz.sha256)
          ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || 'v1.3.6' }}
          name: Meridian Android 1.3.6
          body_path: .github/release-notes-1.3.6.md
          files: |
            dist/Meridian-1.3.6-arm64.apk
            dist/Meridian-1.3.6-arm64.apk.sha256
            dist/Meridian-1.3.6-src.tar.gz
            dist/Meridian-1.3.6-src.tar.gz.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
